<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="webページのURLからLaTeX形式の参考文献リストを出力するサイトです">
        <title>Reference-Maker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="notice"></div>
        <hr class="hr_gray">
        <div id="urls_form">
            <textarea name="input_form" cols="100" rows="10">
                URLをペーストしてください
            </textarea>
        </div>
        <hr class="hr_gray">
        <div id="output_section"></div>
        <div id="copied_button">
            <p class="center">コピーする</p>
            <button id="for_copi"></button>
        </div>
    </body>
</html>
